{% extends "base.html" %}{% block content %}<section class="form-card"><span class="eyebrow">STUDENT SETUP</span><h1>Create your learning profile</h1><p class="muted">No login or registration required. This is a single-student local demo.</p><form method="post"><label>Name</label><input name="name" value="{{p.name}}" required><label>Email (optional)</label><input name="email" type="email" value="{{p.email}}"><label>Career goal</label><select name="career">{% for c in careers %}<option {% if p.career==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><button class="btn">Save and continue</button></form></section>{% endblock %}
