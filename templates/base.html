<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartSkill Mentor</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><script defer src="{{url_for('static',filename='app.js')}}"></script></head><body><header class="navbar"><a class="brand" href="{{url_for('dashboard')}}">✦ SmartSkill Mentor</a><button class="menu" onclick="document.querySelector('.links').classList.toggle('show')">☰</button><nav class="links"><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('career')}}">Career</a><a href="{{url_for('planner')}}">Planner</a><a href="{{url_for('leaderboard')}}">Leaderboard</a><a href="{{url_for('notifications')}}">Notifications ({{unread}})</a><a href="{{url_for('profile')}}">Profile</a><a href="{{url_for('admin_login')}}">Admin</a><button class="theme" onclick="toggleTheme()">◐ Theme</button></nav></header><main class="container">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer class="footer">SmartSkill Mentor · Learn Skills · Build Your Career</footer></body></html>
