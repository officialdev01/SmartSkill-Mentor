{% extends "base.html" %}{% block content %}<h1>Daily Study Planner</h1><section class="form-card"><form method="post" class="inlineform"><div><label>Task</label><input name="title" required placeholder="Practice HTML forms"></div><div><label>Date</label><input type="date" name="task_date" value="{{today}}" required></div><button class="btn">Add task</button></form></section><section class="card"><h2>Study tasks</h2>{% for t in tasks %}<div class="taskrow"><div><b class="{{'done' if t.done else ''}}">{{t.title}}</b><small>{{t.task_date}}</small></div><div class="actions"><form method="post" action="{{url_for('task_toggle',tid=t.id)}}"><button class="btn small secondary">{{"Undo" if t.done else "Done"}}</button></form><form method="post" action="{{url_for('task_delete',tid=t.id)}}"><button class="btn small danger">Delete</button></form></div></div>{% else %}<p class="muted">No tasks added yet.</p>{% endfor %}</section>{% endblock %}
