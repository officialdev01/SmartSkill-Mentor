{% extends "base.html" %}{% block content %}<section class="form-card"><span class="eyebrow">CAREER RECOMMENDATION</span><h1>Choose a career path</h1><p class="muted">Changing path replaces your current skill checklist.</p><form method="post"><div class="grid two">{% for c,items in careers.items() %}<label class="career"><input type="radio" name="career" value="{{c}}" {% if current==c %}checked{% endif %}><b>{{c}}</b><small>{{items|join(" · ")}}</small></label>{% endfor %}</div><button class="btn">Save career path</button></form></section>{% endblock %}
