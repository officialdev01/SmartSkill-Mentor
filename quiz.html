{% extends "base.html" %}{% block content %}<section class="form-card"><span class="eyebrow">KNOWLEDGE CHECK</span><h1>{{skill}} Quiz</h1><form method="post" action="{{url_for('quiz_submit',skill=skill)}}">{% for q in questions %}{% set qi=loop.index0 %}<div class="question"><h3>Q{{loop.index}}. {{q[0]}}</h3>{% for op in q[1] %}<label class="option"><input type="radio" name="q{{qi}}" value="{{loop.index0}}" required> {{op}}</label>{% endfor %}</div>{% endfor %}<button class="btn">Submit quiz</button></form></section>{% endblock %}
