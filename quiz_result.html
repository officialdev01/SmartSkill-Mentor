{% extends "base.html" %}{% block content %}<section class="form-card narrow"><span class="eyebrow">QUIZ RESULT</span><h1>{{skill}}</h1><div class="score">{{score}} / {{total}}</div><h2>{{(score*100/total)|round|int}}% score</h2><p>{{"Great work! You passed this practice quiz." if score*100/total>=60 else "Keep practicing and try again."}}</p><a class="btn" href="{{url_for('quiz',skill=skill)}}">Try again</a> <a class="btn secondary" href="{{url_for('leaderboard')}}">Leaderboard</a></section>{% endblock %}
